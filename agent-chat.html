<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>研屿 | Agent 择校分析</title>
<script src="mock-api.js"></script>
<script src="assets/vendor/echarts.min.js"></script>
<link rel="stylesheet" href="assets/app.css?v=10">
<style>
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .main { display: flex; flex: 1; overflow: hidden; margin-left: 56px; }

  /* ══════ 手机端：会话列表抽屉化 ══════ */
  .hamburger { display: none; }
  @media (max-width: 767px) {
    /* 关键覆盖带 !important：本块需压过文档更后面的桌面规则 */
    .main { margin-left: 0 !important; position: relative; padding: 0 !important; }
    .chat-area { padding: 0 !important; }

    /* 消息流：全宽 + 气泡（用户右/Agent 左） */
    .messages { width: 100% !important; max-width: none !important; margin: 0 !important;
      padding: 12px 10px 8px !important; }
    .msg { gap: 8px !important; }
    .msg-avatar { width: 26px !important; height: 26px !important; border-radius: 8px !important; }
    .msg-avatar svg { width: 16px !important; height: 16px !important; }
    .msg.user { flex-direction: row-reverse !important; }
    .msg.user .msg-avatar { display: none !important; }
    .msg.user .msg-name { display: none !important; }
    .msg.user .msg-body { margin-left: auto !important; max-width: 85% !important; padding: 9px 12px !important;
      border-radius: 14px 14px 3px 14px !important;
      background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(0,0,0,.06)), var(--accent, #6db3a3) !important;
      color: #10201d !important; }
    /* 气泡：浅色用淡青纸感（柔和不抢眼）；深色沿用原 accent 实底不变 */
    [data-theme="light"] .msg.user .msg-body {
      color: #22423d !important;
      background: #d8eae5 !important;
      border: 1px solid rgba(14,110,99,0.18) !important; }
    .msg.user .msg-content, .msg.user .msg-content p, .msg.user .msg-content strong { color: inherit !important; margin-bottom: 0 !important; }
    .msg.agent .msg-body { max-width: 94% !important; background: var(--bg-glass) !important; padding: 10px 13px !important;
      border-radius: 3px 14px 14px 14px !important; }

    /* 输入区：贴边紧凑；底部给固定导航栏（60px+安全区）留出空间，否则提示行整个陷进底栏 */
    .input-area { padding: 8px 10px calc(70px + env(safe-area-inset-bottom, 0px)) !important;
      background: transparent !important; border-top: none !important; }
    /* 整张卡片框住 输入行 + 快捷提示行，视觉上一个整体 */
    .input-area .input-card {
      border-radius: 14px !important; padding: 5px 5px 3px !important;
      /* 半透明毛玻璃：与输入内容形成透明度区分，又和全站玻璃质感统一 */
      backdrop-filter: blur(22px) saturate(1.2) !important;
      -webkit-backdrop-filter: blur(22px) saturate(1.2) !important;
      box-shadow: inset 0 0 0 1px rgba(var(--brand-rgb),.07) !important; }
    [data-theme="dark"] .input-area .input-card { background: rgba(46,43,41,0.72) !important; }
    [data-theme="light"] .input-area .input-card { background: rgba(255,255,255,0.66) !important; }
    .input-area .input-wrap { margin: 0 !important; width: 100% !important; padding: 5px 5px 5px 14px !important;
      /* 圆角跟随发送按钮 0.75rem；align-items 基础值是 flex-end（多行向上生长用），单行时文字会沉底显歪，改居中 */
      border-radius: 0.75rem !important; align-items: center !important;
      background: transparent !important; border: none !important; box-shadow: none !important; }
    .input-area .input-wrap textarea { width: 100% !important; font-size: 14.5px !important; }
    .input-area .input-hints { margin: 2px 6px 4px 10px !important; width: auto !important;
      flex-wrap: nowrap !important; overflow-x: auto !important; scrollbar-width: none;
      padding: 6px 4px 4px !important;
      border-top: 1px solid rgba(var(--brand-rgb), 0.06) !important; }
    .input-hints::-webkit-scrollbar { display: none !important; }
    .hint-btn { white-space: nowrap !important; flex-shrink: 0 !important; }

    /* 会话抽屉：实底面板 + off-canvas（此前重写时丢失的关键规则） */
    .chat-side {
      position: fixed !important; z-index: 300 !important;
      left: 0 !important; top: 0 !important; bottom: 0 !important;
      width: min(300px, 85vw) !important;
      transform: translateX(-102%) !important;
      visibility: hidden !important;  /* 收起时连投影一起藏，否则影子从左缘探进页面 */
      transition: transform .32s cubic-bezier(.16,1,.3,1), visibility 0s .32s !important;
      box-shadow: 20px 0 60px rgba(0,0,0,.4) !important;
      /* 基础样式是 4% 透明底（桌面贴页侧栏用），浮层必须实底否则整块透视 */
      background: var(--bg-elevated, #2e2b29) !important;
    }
    .chat-side.open { transform: none !important; visibility: visible !important;
      transition: transform .32s cubic-bezier(.16,1,.3,1), visibility 0s 0s !important; }
    .chat-side-backdrop {
      position: fixed; inset: 0; z-index: 290; background: rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .chat-side-backdrop.show { opacity: 1; pointer-events: auto; }
    .hamburger { display: grid !important; place-items: center; width: 34px; height: 34px;
      border-radius: 10px; border: 1px solid rgba(var(--brand-rgb), 0.16);
      background: rgba(var(--brand-rgb), 0.06); color: rgba(var(--brand-rgb), 0.8);
      cursor: pointer; margin-right: 10px; }
    .hamburger svg { width: 17px; height: 17px; }
  }

  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  /* 消息列与底部输入框同宽同轴（区域居中，边缘对齐） */
  .messages {
    flex: 1; overflow-y: auto; padding: 24px 28px;
    width: min(1000px, calc(100% - 48px));
    margin: 0 auto;
  }
  .input-area { padding: 16px 0; }
  .input-area .input-wrap,
  .input-area .input-hints {
    width: min(1000px, calc(100% - 48px));
    margin: 0 auto;
  }
  .input-area .input-hints { margin-top: 8px; }

  .debate-summary { font-size: 12px; color: rgba(var(--brand-rgb),0.40); margin-top: 4px; }

  .chat-section-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
    color: rgba(var(--brand-rgb),0.35); padding: 12px 12px 6px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .chat-section-title svg { width: 12px; height: 12px; opacity: 0.5; }
  .conv-more-btn {
    width: calc(100% - 16px); margin: 2px 8px 8px; padding: 6px;
    background: none; border: 1px dashed rgba(var(--brand-rgb),0.18); border-radius: 8px;
    color: rgba(var(--brand-rgb),0.45); font-size: 11px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .conv-more-btn:hover { color: rgba(var(--brand-rgb),0.75); border-color: rgba(var(--brand-rgb),0.35); }
  .chat-section-empty { padding: 6px 12px; font-size: 11px; color: rgba(var(--brand-rgb),0.25); }
  .chat-item .chat-type-badge {
    display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 4px;
    background: rgba(var(--brand-rgb),0.08); color: rgba(var(--brand-rgb),0.40);
    margin-left: 4px; vertical-align: middle;
  }
  .study-msg-user { color: rgba(var(--brand-rgb),0.70); margin: 8px 0 2px; font-size: 13px; }
  .study-msg-assistant {
    background: rgba(var(--line-rgb),0.06); border-radius: 0.75rem; padding: 10px 14px;
    margin: 4px 0 12px; font-size: 13px; color: rgba(var(--brand-rgb),0.75); line-height: 1.6;
  }
  .chat-item { position: relative; }
  .chat-item-del {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px; border-radius: 4px;
    color: rgba(var(--brand-rgb),0.30); opacity: 0; transition: all 0.2s;
    display: flex; align-items: center;
  }
  .chat-item:hover .chat-item-del { opacity: 1; }
  .chat-item-del:hover { color: rgba(230,120,100,0.85); background: rgba(230,120,100,0.1); }

/* ── DEMO MODE Badge ── */
.demo-badge {
  position: fixed; bottom: 16px; right: 16px; z-index: 99999;
  padding: 6px 14px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: #1a1a1a; background: linear-gradient(135deg, #fbbf24, #f59e0b);
  box-shadow: 0 4px 16px rgba(245,158,11,0.35);
  pointer-events: none; user-select: none;
  animation: demoBadgePulse 3s ease-in-out infinite;
}
@keyframes demoBadgePulse {
  0%, 100% { opacity: 0.85; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.04); }
}
@media (max-width: 767px) {
  .demo-badge { bottom: 72px; right: 10px; font-size: 10px; padding: 5px 10px; }
}

</style>
</head>
<body>
<div class="demo-badge">DEMO MODE</div>
<div data-nav="agent-chat"></div>

<div data-header></div>

<div class="main">
  <!-- 会话侧栏 -->
  <div class="chat-side-backdrop" id="chatSideBackdrop" onclick="toggleChatSide(false)"></div>
  <div class="chat-side">
    <div class="chat-side-header">
      <button class="new-chat-btn" onclick="newChat()">＋ 新 Agent 对话</button>
    </div>
    <div class="chat-list" id="chatList">
      <div class="chat-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        Agent 择校分析
      </div>
      <div id="agentConvList"><div style="padding:12px;font-size:12px;color:rgba(244,231,211,0.35)">加载中…</div></div>
      <div class="chat-section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        AI 伴学记录
      </div>
      <div id="studyConvList"><div style="padding:12px;font-size:12px;color:rgba(244,231,211,0.25)">暂无记录</div></div>
    </div>
    <div class="profile-panel">
      <div class="profile-title">我的画像</div>
      <div class="profile-tags" id="profileTags"><span class="profile-tag">未填写</span></div>
    </div>
  </div>

  <!-- 对话区 -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg">
        <div class="msg-avatar agent"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.4l1.15 2.3h-2.3L12 1.4z" fill="#ffd98a"/><rect x="10.2" y="4.1" width="3.6" height="1.9" rx="0.5" fill="#ffd98a"/><path d="M10.4 6.3h3.2l1.05 11.6h-5.3l1.05-11.6z" fill="#fdf6e8"/><path d="M8.4 9.8L5 8.4M15.6 9.8l3.4-1.4" stroke="#ffd98a" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/><path d="M7.2 20.8c1.6-.9 3.2-.9 4.8 0 1.6-.9 3.2-.9 4.8 0" stroke="#9fd0c6" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <div class="msg-body">
          <div class="msg-name">择校分析 Agent</div>
          <div class="msg-content">
            <p>你好，我是你的择校分析 Agent。所有结论都基于实时舆情查询与官方数据，分析过程全程可见。</p>
            <p>可以试着问我：</p>
            <p>• 清华计算机和华科计算机怎么选？<br>
               • 中科大计算机是不是被低估了？<br>
               • 双非跨考计算机有哪些风险？</p>
          </div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-card">
        <div class="input-wrap">
          <textarea id="chatInput" rows="1" placeholder="问我任何关于择校的问题…"></textarea>
          <button class="send-btn" id="sendBtn" onclick="send()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
        <div class="input-hints">
          <button class="hint-btn" onclick="fillInput('清华计算机和中科大计算机怎么选？')">对比分析</button>
          <button class="hint-btn" onclick="fillInput('深入分析电子科大信息与通信工程的劝退信号')">深度调查</button>
          <button class="hint-btn" id="debateHint" onclick="toggleDebate()">开启辩论</button>
          <button class="hint-btn" onclick="genReport()">生成报告</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js?v=18"></script>
<script>
document.querySelector('[data-nav]').outerHTML = navSidebar('agent-chat');

// 手机端：会话列表抽屉
function toggleChatSide(open) {
  document.querySelector('.chat-side').classList.toggle('open', open);
  document.getElementById('chatSideBackdrop').classList.toggle('show', open);
}
mountHeader('研屿 · Agent 择校分析',
  `<button class="ph-btn" id="debateBtn" onclick="toggleDebate()" title="需要配置 LLM_API_KEY 且开启 AGENT_DEBATE_ENABLED">辩论模式：关</button>
   <a class="ph-btn" href="dashboard.html">数据大盘</a>
   <button class="ph-btn" onclick="location.href='report.html'">历史报告</button>`);

// 手机端：短占位符（长示例文字在窄输入框里显示不全）
if (window.innerWidth <= 767) {
  const ci = document.getElementById('chatInput');
  if (ci) ci.placeholder = '输入你的问题…';
}

// 手机端：顶栏汉堡，呼出会话抽屉
(function() {
  const left = document.querySelector('.page-header .ph-left');
  if (!left) return;
  const btn = document.createElement('button');
  btn.className = 'hamburger';
  btn.setAttribute('aria-label', '会话列表');
  btn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';
  btn.onclick = () => toggleChatSide(true);
  left.insertBefore(btn, left.firstChild);
})();

let currentConvId = localStorage.getItem('gy_last_conv') || null;
let debateOn = false;
let lastCards = [];
let sending = false;

// ── 画像标签 ──
(async () => {
  try {
    const p = await api('/profile/me');
    const tags = [];
    const bg = p.background || {};
    if (bg.school_tier) tags.push(bg.school_tier);
    if (bg.is_cross_discipline) tags.push('跨考');
    if (p.risk_preference) tags.push(p.risk_preference);
    (p.priorities || []).slice(0, 3).forEach(x => tags.push(x));
    (p.hard_constraints || []).slice(0, 2).forEach(x => tags.push(x));
    document.getElementById('profileTags').innerHTML = tags.length
      ? tags.map(t => `<span class="profile-tag">${esc(t)}</span>`).join('')
      : '<span class="profile-tag">未填写，可在对话中完成引导</span>';
  } catch (e) { /* ignore */ }
})();

// ── 会话列表 ──
const CONV_PREVIEW = 4; // 每个分区默认展示条数，其余折叠进「展开全部」
function toggleConvList(key) {
  localStorage.setItem(key, localStorage.getItem(key) === '1' ? '0' : '1');
  loadConvList();
}
async function loadConvList() {
  try {
    const [agentData, studyData] = await Promise.all([
      api('/agent/conversations?chat_type=agent'),
      api('/agent/conversations?chat_type=study'),
    ]);
    const agentEl = document.getElementById('agentConvList');
    const studyEl = document.getElementById('studyConvList');

    const itemHtml = (c, openFn) => `
        <div class="chat-item ${c.id === currentConvId ? 'active' : ''}" onclick="${openFn}('${c.id}')">
          <div class="chat-item-title">${esc(c.title)}</div>
          <div class="chat-item-time">${fmtTime(c.updated_at)}${c.debate_enabled ? ' · 辩论' : ''}</div>
          <button class="chat-item-del" onclick="event.stopPropagation();deleteConv('${c.id}')" title="删除对话">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>`;
    const sectionHtml = (items, openFn, storeKey) => {
      const expanded = localStorage.getItem(storeKey) === '1';
      let shown = expanded ? items : items.slice(0, CONV_PREVIEW);
      if (!expanded) {
        // 当前打开的对话即使在折叠区也保持可见（替换末位）
        const act = items.find(c => c.id === currentConvId);
        if (act && !shown.includes(act) && shown.length) shown = shown.slice(0, CONV_PREVIEW - 1).concat([act]);
      }
      let html = shown.map(c => itemHtml(c, openFn)).join('');
      if (items.length > CONV_PREVIEW) {
        const hidden = items.length - CONV_PREVIEW;
        html += `<button class="conv-more-btn" onclick="toggleConvList('${storeKey}')">${expanded ? '收起' : `展开全部 ${items.length} 条（还有 ${hidden} 条）`}</button>`;
      }
      return html;
    };

    if (!agentData.items.length) {
      agentEl.innerHTML = '<div class="chat-section-empty">暂无对话，发送第一条消息开始</div>';
    } else {
      agentEl.innerHTML = sectionHtml(agentData.items, 'openConv', 'gy_conv_exp_agent');
    }

    if (!studyData.items.length) {
      studyEl.innerHTML = '<div class="chat-section-empty">暂无记录</div>';
    } else {
      studyEl.innerHTML = sectionHtml(studyData.items, 'openStudyConv', 'gy_conv_exp_study');
    }
  } catch (e) { /* ignore */ }
}

function newChat() {
  currentConvId = null;
  localStorage.removeItem('gy_last_conv');
  document.getElementById('messages').innerHTML = `
    <div class="msg">
      <div class="msg-avatar agent"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.4l1.15 2.3h-2.3L12 1.4z" fill="#ffd98a"/><rect x="10.2" y="4.1" width="3.6" height="1.9" rx="0.5" fill="#ffd98a"/><path d="M10.4 6.3h3.2l1.05 11.6h-5.3l1.05-11.6z" fill="#fdf6e8"/><path d="M8.4 9.8L5 8.4M15.6 9.8l3.4-1.4" stroke="#ffd98a" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/><path d="M7.2 20.8c1.6-.9 3.2-.9 4.8 0 1.6-.9 3.2-.9 4.8 0" stroke="#9fd0c6" stroke-width="1.2" stroke-linecap="round"/></svg></div>
      <div class="msg-body">
        <div class="msg-name">择校分析 Agent</div>
        <div class="msg-content"><p>新对话已就绪，说出你的择校问题吧。</p></div>
      </div>
    </div>`;
  loadConvList();
}

async function deleteConv(id) {
  try {
    await api(`/agent/conversations/${id}`, { method: 'DELETE' });
    if (currentConvId === id) {
      currentConvId = null;
      localStorage.removeItem('gy_last_conv');
      document.getElementById('messages').innerHTML = `
        <div class="msg">
          <div class="msg-avatar agent"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.4l1.15 2.3h-2.3L12 1.4z" fill="#ffd98a"/><rect x="10.2" y="4.1" width="3.6" height="1.9" rx="0.5" fill="#ffd98a"/><path d="M10.4 6.3h3.2l1.05 11.6h-5.3l1.05-11.6z" fill="#fdf6e8"/><path d="M8.4 9.8L5 8.4M15.6 9.8l3.4-1.4" stroke="#ffd98a" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/><path d="M7.2 20.8c1.6-.9 3.2-.9 4.8 0 1.6-.9 3.2-.9 4.8 0" stroke="#9fd0c6" stroke-width="1.2" stroke-linecap="round"/></svg></div>
          <div class="msg-body">
            <div class="msg-name">择校分析 Agent</div>
            <div class="msg-content"><p>新对话已就绪，说出你的择校问题吧。</p></div>
          </div>
        </div>`;
    }
    loadConvList();
  } catch (e) { /* ignore */ }
}

// ── 消息渲染 ──
function userMsgHtml(content) {
  return `
  <div class="msg user">
    <div class="msg-avatar user">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="msg-body">
      <div class="msg-name">你</div>
      <div class="msg-content"><p>${esc(content)}</p></div>
    </div>
  </div>`;
}

function traceBlockHtml(trace) {
  if (!trace || !trace.length) return '';
  const plan = trace.filter(t => t.phase === 'plan');
  const tools = trace.filter(t => t.phase === 'tool' || t.phase === 'tool_result');
  const steps = plan.map(t => `
    <div class="thinking-step"><div class="step-num">·</div>
      <div class="step-text">${esc(typeof t.detail === 'string' ? t.detail : (t.detail?.reasoning || t.title))}</div></div>`).join('');
  const toolRows = [];
  for (let i = 0; i < tools.length; i++) {
    const t = tools[i];
    if (t.phase !== 'tool') continue;
    const res = tools[i + 1] && tools[i + 1].phase === 'tool_result' ? tools[i + 1] : null;
    toolRows.push(`
      <div class="tool-call">
        <div><span class="tool-name">${esc(t.title.replace('调用工具 ', ''))}</span>(${esc(JSON.stringify(t.detail || {}))})</div>
        ${res ? `<div class="tool-result">${esc(JSON.stringify(res.detail).slice(0, 260))}</div>` : ''}
      </div>`);
  }
  if (!steps && !toolRows.length) return '';
  return `
  <div class="thinking-block">
    <div class="thinking-header" onclick="const b=this.nextElementSibling;b.style.display=b.style.display==='none'?'block':'none'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(244,231,211,0.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><line x1="10" y1="22" x2="14" y2="22"/></svg>
      <span class="thinking-title">分析过程 — ${plan.length ? '规划 ' + plan.length + ' 项 · ' : ''}工具调用 ${tools.filter(t => t.phase === 'tool').length} 次</span>
      <span class="thinking-toggle">点击折叠/展开</span>
    </div>
    <div class="thinking-body">
      ${steps}
      ${toolRows.join('')}
    </div>
  </div>`;
}

function cardHtml(c) {
  if (!c || !c.school) return '';
  return `
  <div class="decision-card" style="border-radius:1rem;padding:16px;margin:12px 0">
    <div class="dc-header">
      <div class="dc-title" style="font-size:14px">${esc(c.school)} · ${esc(c.major || '')}</div>
      <div style="text-align:right">
        <div class="dc-score ${c.heat >= 80 ? 'score-low' : c.heat >= 60 ? 'score-mid' : 'score-high'}" style="font-size:18px">${c.heat ?? '—'}</div>
        <div class="dc-sub">${signed(c.mom_growth)}</div>
      </div>
    </div>
    <div class="conv-metric-row" style="gap:20px">
      <div class="conv-metric"><div class="conv-metric-label">劝退 <span class="cred cred-t3">T3</span></div><div class="conv-metric-value">${c.discouragement ?? '—'}</div></div>
      <div class="conv-metric"><div class="conv-metric-label">趋势</div><div class="conv-metric-value">${{rising:'↑ 上升',falling:'↓ 下降',stable:'→ 平稳'}[c.trend] || '—'}</div></div>
      <div class="conv-metric"><div class="conv-metric-label">置信度</div><div class="conv-metric-value">${esc(c.confidence || '参考')}</div></div>
    </div>
  </div>`;
}

function debateHtml(trace) {
  if (!trace) return '';
  const roles = trace.filter(t => t.phase === 'debate' && /观点$/.test(t.title));
  const conclusion = trace.find(t => t.title === '辩论收敛结论');
  if (!roles.length) return '';
  const roleCls = t => /激进/.test(t.title) ? 'aggressive' : /保守/.test(t.title) ? 'conservative' : 'data';
  return `
  <div class="debate-block">
    <div class="debate-header">
      <span class="debate-title">三方辩论结论</span>
    </div>
    <div class="debate-body">
      ${roles.map(t => `
      <div class="debate-role">
        <div class="role-badge role-${roleCls(t)}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(244,231,211,0.80)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="role-content">
          <div class="role-name ${roleCls(t)}">${esc(t.title)}</div>
          <div class="role-text">${esc(t.detail || '')}</div>
        </div>
      </div>`).join('')}
      ${conclusion ? `<div class="debate-conclusion"><strong>综合结论：</strong>${esc(conclusion.detail || '')}</div>` : ''}
    </div>
  </div>`;
}

function agentMsgHtml(msg) {
  const trace = msg.trace || [];
  const cards = (msg.cards || []).map(cardHtml).join('');
  return `
  <div class="msg">
    <div class="msg-avatar agent"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.4l1.15 2.3h-2.3L12 1.4z" fill="#ffd98a"/><rect x="10.2" y="4.1" width="3.6" height="1.9" rx="0.5" fill="#ffd98a"/><path d="M10.4 6.3h3.2l1.05 11.6h-5.3l1.05-11.6z" fill="#fdf6e8"/><path d="M8.4 9.8L5 8.4M15.6 9.8l3.4-1.4" stroke="#ffd98a" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/><path d="M7.2 20.8c1.6-.9 3.2-.9 4.8 0 1.6-.9 3.2-.9 4.8 0" stroke="#9fd0c6" stroke-width="1.2" stroke-linecap="round"/></svg></div>
    <div class="msg-body">
      <div class="msg-name">择校分析 Agent</div>
      <div class="msg-content">${mdLite(msg.content)}</div>
      ${traceBlockHtml(trace)}
      ${cards}
      ${debateHtml(trace)}
      <div class="debate-summary">工具调用 ${(trace.filter(t => t.phase === 'tool')).length} 次 · 数据均标注可信度（T1官方/T2半官方/T3舆情推算）</div>
    </div>
  </div>`;
}

// ── 会话加载 ──
async function openConv(id) {
  currentConvId = id;
  localStorage.setItem('gy_last_conv', id);
  try {
    const conv = await api(`/agent/conversations/${id}`);
    const el = document.getElementById('messages');
    const msgs = conv.messages || [];
    el.innerHTML = msgs.length
      ? msgs.map(m => m.role === 'user' ? userMsgHtml(m.content) : agentMsgHtml(m)).join('')
      : '<div style="text-align:center;color:rgba(244,231,211,0.35);font-size:13px;padding:40px 0">会话为空</div>';
    // 记录最后一张卡片的院校，供生成报告
    for (let i = msgs.length - 1; i >= 0; i--) {
      if (msgs[i].role === 'assistant' && (msgs[i].cards || []).length) { lastCards = msgs[i].cards; break; }
    }
    document.getElementById('messages').scrollTop = 999999;
    loadConvList();
  } catch (e) { toast(e.message, 'err'); }
}

async function openStudyConv(id) {
  currentConvId = id;
  try {
    const conv = await api(`/agent/conversations/${id}`);
    const el = document.getElementById('messages');
    const msgs = conv.messages || [];
    if (!msgs.length) {
      el.innerHTML = '<div style="text-align:center;color:rgba(244,231,211,0.35);font-size:13px;padding:40px 0">会话为空</div>';
    } else {
      el.innerHTML = `
        <div style="text-align:center;padding:16px 0 24px">
          <div style="font-size:14px;color:rgba(var(--brand-rgb),0.55);font-weight:500">AI 伴学 · ${esc(conv.title)}</div>
          <div style="font-size:11px;color:rgba(var(--brand-rgb),0.30);margin-top:4px">历史记录（在自习室中继续对话）</div>
        </div>
        ${msgs.map(m => m.role === 'user'
          ? `<div class="study-msg-user">你：${esc(m.content)}</div>`
          : `<div class="study-msg-assistant">${mdLite(m.content)}</div>`
        ).join('')}`;
    }
    document.getElementById('messages').scrollTop = 999999;
    showStudyMode();
    loadConvList();
  } catch (e) { toast(e.message, 'err'); }
}

function showStudyMode() {
  const inputArea = document.querySelector('.input-area');
  inputArea.innerHTML = `
    <div style="text-align:center;padding:16px;color:rgba(var(--brand-rgb),0.40);font-size:13px">
      这是 AI 伴学的历史记录，请前往
      <a href="study-room.html" style="color:var(--accent,#6db3a3);text-decoration:underline">自习室</a>
      继续对话
      <button class="hint-btn" style="margin-left:12px" onclick="backToAgentMode()">返回 Agent 模式</button>
    </div>`;
}

function backToAgentMode() {
  location.reload();
}

// ── 发送 ──
async function send() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || sending) return;
  sending = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  const el = document.getElementById('messages');
  el.insertAdjacentHTML('beforeend', userMsgHtml(text));
  const typing = document.createElement('div');
  typing.className = 'msg';
  typing.id = 'typingMsg';
  typing.innerHTML = `
    <div class="msg-avatar agent"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.4l1.15 2.3h-2.3L12 1.4z" fill="#ffd98a"/><rect x="10.2" y="4.1" width="3.6" height="1.9" rx="0.5" fill="#ffd98a"/><path d="M10.4 6.3h3.2l1.05 11.6h-5.3l1.05-11.6z" fill="#fdf6e8"/><path d="M8.4 9.8L5 8.4M15.6 9.8l3.4-1.4" stroke="#ffd98a" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/><path d="M7.2 20.8c1.6-.9 3.2-.9 4.8 0 1.6-.9 3.2-.9 4.8 0" stroke="#9fd0c6" stroke-width="1.2" stroke-linecap="round"/></svg></div>
    <div class="msg-body">
      <div class="msg-name">择校分析 Agent</div>
      <div class="msg-content">
        <div class="conv-typing"><div class="conv-typing-dot"></div><div class="conv-typing-dot"></div><div class="conv-typing-dot"></div></div>
        <p style="font-size:12px;color:rgba(244,231,211,0.35)">正在查询舆情数据库与官方数据…（阻塞模式，SSE 流式暂未接入）</p>
      </div>
    </div>`;
  el.appendChild(typing);
  el.scrollTop = 999999;

  try {
    const r = await api('/agent/chat/blocking', {
      method: 'POST',
      body: { conversation_id: currentConvId, message: text, debate_enabled: debateOn },
    });
    document.getElementById('typingMsg')?.remove();
    currentConvId = r.conversation_id;
    localStorage.setItem('gy_last_conv', currentConvId);
    // 用户消息已在本地插入，这里只补最后一条 assistant（trace/cards 完整）
    const conv = await api(`/agent/conversations/${r.conversation_id}`);
    const lastAssistant = (conv.messages || []).filter(m => m.role === 'assistant').slice(-1);
    document.getElementById('typingMsg')?.remove();
    el.insertAdjacentHTML('beforeend', lastAssistant.map(m => agentMsgHtml(m)).join(''));
    for (let i = (conv.messages || []).length - 1; i >= 0; i--) {
      if (conv.messages[i].role === 'assistant' && (conv.messages[i].cards || []).length) { lastCards = conv.messages[i].cards; break; }
    }
    el.scrollTop = 999999;
    loadConvList();
  } catch (e) {
    document.getElementById('typingMsg')?.remove();
    el.insertAdjacentHTML('beforeend', `
      <div class="msg"><div class="msg-avatar agent"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 1.4l1.15 2.3h-2.3L12 1.4z" fill="#ffd98a"/><rect x="10.2" y="4.1" width="3.6" height="1.9" rx="0.5" fill="#ffd98a"/><path d="M10.4 6.3h3.2l1.05 11.6h-5.3l1.05-11.6z" fill="#fdf6e8"/><path d="M8.4 9.8L5 8.4M15.6 9.8l3.4-1.4" stroke="#ffd98a" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/><path d="M7.2 20.8c1.6-.9 3.2-.9 4.8 0 1.6-.9 3.2-.9 4.8 0" stroke="#9fd0c6" stroke-width="1.2" stroke-linecap="round"/></svg></div><div class="msg-body">
      <div class="msg-name">择校分析 Agent</div>
      <div class="msg-content"><p style="color:rgba(230,150,130,0.9)">分析请求失败：${esc(e.message)}</p></div>
      </div></div>`);
  } finally {
    sending = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

function fillInput(t) {
  const input = document.getElementById('chatInput');
  input.value = t;
  input.focus();
}

function toggleDebate() {
  debateOn = !debateOn;
  document.getElementById('debateBtn').textContent = `辩论模式：${debateOn ? '开' : '关'}`;
  document.getElementById('debateBtn').classList.toggle('on', debateOn);
  document.getElementById('debateHint').classList.toggle('on', debateOn);
  toast(debateOn ? '辩论模式已开启（需后端配置 LLM_API_KEY 与 AGENT_DEBATE_ENABLED 生效）' : '辩论模式已关闭');
}

// ── 生成报告 ──
async function genReport() {
  const candidates = (lastCards || [])
    .filter(c => c.school)
    .map(c => ({ school: c.school, major: c.major || '' }));
  if (!candidates.length) {
    toast('当前会话还没有产生候选院校（先让 Agent 做一轮分析）', 'err');
    return;
  }
  try {
    toast(`正在生成报告（${candidates.map(c => c.school).join('/')}）…`);
    const r = await api('/reports/generate', {
      method: 'POST',
      body: { conversation_id: currentConvId, candidates },
    });
    location.href = `report.html?id=${r.id}`;
  } catch (e) { toast(e.message, 'err'); }
}

// ── 输入框自适应 ──
document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('chatInput').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

loadConvList();
if (currentConvId) openConv(currentConvId);
</script>
</body>
</html>
