<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 · 研屿</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/app.css?v=10">
<style>
:root {
  --font-display: ui-serif, Georgia, Cambria, "Times New Roman", Times, "Noto Serif SC", serif;
  --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  color: rgba(var(--brand-rgb), 0.88);
  background: rgb(var(--bg-rgb));
  overflow: hidden;
  display: flex;
}

/* ── 浅色方案（暖白纸张）适配 ── */
[data-theme="light"] .panel-left {
  background:
    radial-gradient(1100px 560px at 72% -12%, rgba(212, 168, 83, 0.10), transparent 62%),
    radial-gradient(900px 520px at 12% 112%, rgba(14, 110, 99, 0.05), transparent 60%),
    linear-gradient(180deg, #f2ede3 0%, rgb(var(--bg-rgb)) 58%, #eae5da 100%);
  border-right: 1px solid rgba(61, 55, 48, 0.10);
}
[data-theme="light"] .l-star { background: rgba(61, 55, 48, 0.35) !important; }
[data-theme="light"] .l-desc { color: rgba(61, 55, 48, 0.62); }
[data-theme="light"] .l-name { color: #3d3730; }
[data-theme="light"] .l-slogan { color: rgba(61, 55, 48, 0.55); }
[data-theme="light"] .l-chip { color: rgba(61, 55, 48, 0.6); background: rgba(61, 55, 48, 0.05); border-color: rgba(61, 55, 48, 0.12); }
[data-theme="light"] .l-chip b { color: #0e6e63; }
  /* 两套主题各是各的天空：
     深色（夜）= 满天星斗为主角，无云无月盘；
     浅色（昼）= 日轮 + 白云，无星星 */
  [data-theme="dark"] .l-sun, [data-theme="dark"] .l-cloud { display: none; }
  [data-theme="light"] .l-star { display: none !important; }
    .isle-cloud { display: none !important; }
  .l-cloud.c2 { background: rgba(255, 255, 255, 0.65); }
  [data-theme="dark"] .l-cloud.c2 { display: none; }

  /* 岛屿插画：浅色=纸上淡彩，深色=夜色剪影 */
  .isle-hill { fill: url(#inkHillDark); }
  .isle-hill-far { fill: rgba(244, 231, 211, 0.05); }
  .isle-sun { fill: rgba(244, 231, 211, 0.10); }
  .isle-cloud ellipse { fill: rgba(244, 231, 211, 0.04); }
  .wave { stroke: rgba(244, 231, 211, 0.10); }
  .lt { fill: rgba(240, 220, 190, 0.85); }
  [data-theme="light"] .isle-hill { fill: url(#inkHillLight); }
  [data-theme="light"] .isle-hill-far { fill: rgba(61, 55, 48, 0.14); }
  [data-theme="light"] .isle-sun { fill: url(#sunDisc); }
  [data-theme="light"] .isle-cloud ellipse { fill: rgba(61, 55, 48, 0.07); }
  [data-theme="light"] .wave { stroke: rgba(61, 55, 48, 0.16); }
  [data-theme="light"] .lt { fill: rgba(61, 55, 48, 0.82); }

  /* ── 天空元素终审：夜=纯星空，昼=日轮+白云（!important 防覆盖） ── */
  [data-theme="dark"] .l-sun,
  [data-theme="dark"] .l-cloud,
  [data-theme="dark"] .l-cloud.c1,
  [data-theme="dark"] .l-cloud.c2,
  [data-theme="dark"] .isle-sun,
  [data-theme="dark"] .isle-cloud { display: none !important; }
  [data-theme="light"] .l-star,
  [data-theme="light"] .l-stars { display: none !important; }
  [data-theme="light"] .l-cloud { background: rgba(255, 255, 255, 0.72) !important; }
  [data-theme="light"] .l-cloud.c2 { background: rgba(255, 255, 255, 0.55) !important; }
  [data-theme="light"] .lt + .lt { }

[data-theme="light"] .l-logo { box-shadow: 0 18px 60px rgba(0,0,0,0.18), 0 0 0 1px rgba(61,55,48,0.08), 0 0 90px rgba(212,168,83,0.15); }

/* ══════ 双板块汇合 / 分离 ══════ */
.panel {
  height: 100%;
  transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}
.panel-left  { width: 64%; }
.panel-right { width: 36%; }
body.boot .panel-left  { transform: translateX(-103%); }
body.boot .panel-right { transform: translateX(103%); }
body.leaving .panel-left  { transform: translateX(-103%); transition: transform 0.6s cubic-bezier(0.55, 0, 0.8, 0.4); }
body.leaving .panel-right { transform: translateX(103%); transition: transform 0.6s cubic-bezier(0.55, 0, 0.8, 0.4); }
body.leaving .panel { pointer-events: none; }

/* 板块内元素：到站后依次浮现 */
.rise {
  opacity: 1; transform: none;
  transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}
body.boot .rise { opacity: 0; transform: translateY(18px); }
body.boot .panel-right .rise { transition-delay: 0.45s; }
body.boot .panel-left  .rise { transition-delay: 0.55s; }
body.leaving .rise { opacity: 0; transform: translateY(-10px); transition: opacity 0.35s ease, transform 0.35s ease; }

/* ══════ 左：品牌视觉（基于灯塔 icon 的海岛夜色） ══════ */
.panel-left {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(1100px 560px at 72% -12%, rgba(212, 168, 83, 0.07), transparent 62%),
    radial-gradient(900px 520px at 12% 112%, rgba(109, 179, 163, 0.06), transparent 60%),
    linear-gradient(180deg, #241f1c 0%, rgb(var(--bg-rgb)) 58%, #1b1815 100%);
  border-right: 1px solid rgba(var(--line-rgb), 0.08);
}
  .l-stars { position: absolute; inset: 0; pointer-events: none; }
  .l-sun {
    position: absolute; top: 9%; right: 14%; width: 150px; height: 150px;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(232,184,109,0.42) 0%, rgba(232,184,109,0.16) 42%, rgba(232,184,109,0) 70%);
  }
  [data-theme="dark"] .l-sun {
    background: radial-gradient(circle, rgba(244,231,211,0.16) 0%, rgba(244,231,211,0.05) 45%, rgba(244,231,211,0) 70%);
  }
  .l-cloud {
    position: absolute; pointer-events: none; border-radius: 999px;
    background: rgba(61, 55, 48, 0.06);
  }

  .l-cloud.c1 { top: 16%; left: 10%; width: 240px; height: 34px; }
  .l-cloud.c1::before { content: ''; position: absolute; left: 22%; top: -55%; width: 45%; height: 120%; border-radius: 999px; background: inherit; }
  .l-cloud.c2 { top: 27%; right: 8%; width: 170px; height: 26px; background: rgba(61, 55, 48, 0.045); }

.l-star {
  position: absolute; border-radius: 50%;
  background: rgba(var(--brand-rgb), 0.7);
  animation: twinkle var(--dur, 4s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}
@keyframes twinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.85; } }

.l-mark { position: relative; text-align: center; z-index: 2; }
.l-logo {
  width: 118px; height: 118px; border-radius: 28px;
  display: block; margin: 0 auto 26px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(var(--line-rgb), 0.09),
              0 0 90px rgba(255, 190, 110, 0.13);
  animation: lglow 5s ease-in-out infinite;
}
@keyframes lglow {
  0%, 100% { box-shadow: 0 18px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(var(--line-rgb),0.09), 0 0 70px rgba(255,190,110,0.10); }
  50%      { box-shadow: 0 18px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(var(--line-rgb),0.09), 0 0 110px rgba(255,190,110,0.20); }
}
.l-name {
  font-family: var(--font-display);
  font-size: clamp(38px, 4.2vw, 54px);
  font-weight: 600;
  color: rgba(var(--brand-rgb), 1);
  letter-spacing: 0.4em; margin-right: -0.4em;
}
.l-divider {
  width: 64px; height: 1px; margin: 20px auto;
  background: linear-gradient(90deg, transparent, rgba(var(--brand-rgb), 0.5), transparent);
}
.l-slogan { font-size: 13px; letter-spacing: 0.3em; margin-right: -0.3em; color: rgba(var(--brand-rgb), 0.5); }
.l-desc {
  margin: 22px auto 0; max-width: 400px;
  font-size: 12.5px; line-height: 2; color: rgba(var(--brand-rgb), 0.38);
}
.l-chips { position: relative; z-index: 2; display: flex; justify-content: center; gap: 14px; margin-top: 34px; width: fit-content; margin-inline: auto; }
.l-chip {
  padding: 9px 20px; border-radius: 999px; font-size: 12px; letter-spacing: 0.1em;
  color: rgba(var(--brand-rgb), 0.62);
  background: rgba(var(--line-rgb), 0.045);
  border: 1px solid rgba(var(--line-rgb), 0.09);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.l-chip b { color: rgba(var(--brand-rgb), 0.92); font-weight: 600; }
.l-isle {
  position: absolute; bottom: -2px; left: 0; right: 0; z-index: 1;
  pointer-events: none; opacity: 0.9;
}
.l-isle svg { display: block; width: 100%; height: auto; }

/* ══════ 右：登录 / 注册 ══════ */
.panel-right {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: 40px 44px;
  background: rgba(var(--panel-rgb), 0.35);
}
.card {
  width: 100%; max-width: 330px;
  display: flex; flex-direction: column;
  margin-left: auto;
  margin-right: auto;
}
.card form { display: flex; flex-direction: column; }
.form-scroll { overflow-y: auto; }
.r-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.r-logo { width: 40px; height: 40px; border-radius: 11px; }
.r-title { font-family: var(--font-display); font-size: 21px; letter-spacing: 0.22em; color: rgba(var(--brand-rgb), 0.95); }
.r-sub { font-size: 11px; color: rgba(var(--brand-rgb), 0.42); margin-top: 3px; letter-spacing: 0.12em; }
.back {
  position: absolute; top: 22px;
  /* clamp：窄窗格下避免贴边被裁（应用内浏览器可视宽度可能略小于布局宽度） */
  right: clamp(26px, 3.5vw, 52px);
  font-size: 12.5px; color: rgba(var(--brand-rgb), 0.4);
  text-decoration: none; transition: color 0.2s ease;
}
.back:hover { color: rgba(var(--brand-rgb), 0.85); }

.tabs {
  display: flex; padding: 4px; margin-bottom: 20px;
  border-radius: 999px; background: rgba(var(--line-rgb), 0.06);
  border: 1px solid rgba(var(--line-rgb), 0.08);
}
.tab {
  flex: 1; padding: 8px 0; text-align: center; font-size: 13px;
  color: rgba(var(--brand-rgb), 0.5); cursor: pointer; border-radius: 999px;
  border: none; background: transparent; font-family: inherit;
  transition: all 0.25s ease;
}
.tab.active { color: rgb(var(--bg-rgb)); background: rgba(var(--brand-rgb), 0.88); font-weight: 600; }

.field { margin-bottom: 13px; }
.field label { display: block; font-size: 12px; color: rgba(var(--brand-rgb), 0.5); margin-bottom: 6px; letter-spacing: 0.05em; }
.field input {
  width: 100%; padding: 10px 14px; font-size: 14px; font-family: inherit;
  color: rgba(var(--brand-rgb), 0.95);
  background: rgba(var(--line-rgb), 0.05);
  border: 1px solid rgba(var(--line-rgb), 0.10);
  border-radius: 10px; outline: none; transition: border-color 0.2s ease;
}
.field input:focus { border-color: rgba(var(--brand-rgb), 0.35); }
.field input::placeholder { color: rgba(var(--brand-rgb), 0.25); }
.field input[type="password"] { letter-spacing: 0.1em; }
.submit {
  width: 100%; margin-top: 8px; padding: 11px 0;
  font-size: 14px; font-weight: 600; letter-spacing: 0.2em; font-family: inherit;
  color: rgb(var(--bg-rgb)); background: rgba(var(--brand-rgb), 0.88);
  border: none; border-radius: 10px; cursor: pointer;
  transition: all 0.25s ease;
}
.submit:hover { background: rgba(var(--brand-rgb), 1); box-shadow: 0 6px 24px rgba(var(--brand-rgb), 0.18); }
.submit:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.err {
  display: none; margin: 2px 0 12px; padding: 8px 12px;
  font-size: 12px; line-height: 1.5; border-radius: 8px;
  color: #e8927c; background: rgba(220, 120, 100, 0.10);
  border: 1px solid rgba(220, 120, 100, 0.22);
}
.err.show { display: block; }
.demo-hint {
  margin-top: 18px; padding-top: 15px; text-align: center;
  font-size: 12px; color: rgba(var(--brand-rgb), 0.38);
  border-top: 1px solid rgba(var(--line-rgb), 0.07);
}
.demo-hint a { color: rgba(var(--brand-rgb), 0.55); text-decoration: none; cursor: pointer; }
.demo-hint a:hover { color: rgba(var(--brand-rgb), 0.85); }

/* ══════ 响应式：窄屏改为单栏（仅右板块从右侧汇入） ══════ */
@media (max-width: 860px) {
  .panel-left { display: none; }
  .panel-right { width: 100%; background: rgb(var(--bg-rgb)); }
  body.boot .panel-right { transform: translateX(103%); }
}

@media (prefers-reduced-motion: reduce) {
  .panel, .rise { transition: none !important; }
  body.boot .panel-left, body.boot .panel-right { transform: none; }
  body.boot .rise { opacity: 1; transform: none; }
}

/* ══════ 维护弹窗 ══════ */
.maint-overlay {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  align-items: center; justify-content: center;
}
.maint-overlay.show { display: flex; }
.maint-box {
  background: rgb(var(--panel-rgb, 32,29,26)); border: 1px solid rgba(var(--line-rgb), 0.15);
  border-radius: 16px; padding: 36px 32px 28px; max-width: 340px; width: 90%;
  text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.4);
  animation: maintIn 0.35s ease;
}
@keyframes maintIn { from { opacity: 0; transform: scale(0.92) translateY(12px); } to { opacity: 1; transform: none; } }
.maint-icon { font-size: 36px; margin-bottom: 14px; }
.maint-title { font-family: var(--font-display); font-size: 17px; color: rgba(var(--brand-rgb), 0.9); margin-bottom: 10px; letter-spacing: 0.1em; }
.maint-desc { font-size: 13px; line-height: 1.7; color: rgba(var(--brand-rgb), 0.5); margin-bottom: 22px; }
.maint-close {
  padding: 9px 28px; border-radius: 999px; font-size: 13px; font-family: inherit;
  color: rgba(var(--brand-rgb), 0.7); background: rgba(var(--line-rgb), 0.08);
  border: 1px solid rgba(var(--line-rgb), 0.12); cursor: pointer; transition: all 0.2s ease;
}
.maint-close:hover { background: rgba(var(--line-rgb), 0.15); color: rgba(var(--brand-rgb), 0.9); }


</style>
<script>
// 主题跟随全站方案：手动偏好 > 时间自动（白天米白 / 夜间暗黑）
(function() {
  var t = localStorage.getItem('gy_theme');
  if (!t) { var h = new Date().getHours(); t = (h >= 6 && h < 18) ? 'light' : 'dark'; }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body class="boot">
<!-- ══════ 左：品牌视觉 ══════ -->
<section class="panel panel-left">
  <div class="l-stars" id="lstars"></div>
  <div class="l-sun"></div>
  <div class="l-cloud c1"></div>
  <div class="l-cloud c2"></div>
  <div class="l-mark">
    <img class="l-logo rise" src="assets/favicon.png" alt="研屿">
    <div class="l-name rise">研 屿</div>
    <div class="l-divider rise"></div>
    <div class="l-slogan rise">于信息汪洋 · 筑备考之屿</div>
    <p class="l-desc rise">
      在考研信息洪流扑面、各路观点交织、海量信息难以分辨的世界里，
      拨开迷雾找寻到你的归处——隔绝尘世嘈杂的小小岛屿，是你最好的归宿。
    </p>
    <div class="l-chips rise">
      <span class="l-chip"><b>研澜</b> · 舆情分析</span>
      <span class="l-chip"><b>筑屿</b> · 沉浸自习室</span>
    </div>
  </div>
  <div class="l-isle">
    <svg viewBox="0 0 1600 240" preserveAspectRatio="xMidYMax meet">
      <defs>
        <radialGradient id="lgGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e8b86d" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#e8b86d" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="lgBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8b86d" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#e8b86d" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="inkHillLight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8a7f6f"/>
          <stop offset="100%" stop-color="#3d3730"/>
        </linearGradient>
        <linearGradient id="inkHillDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(200,190,170,0.16)"/>
          <stop offset="100%" stop-color="rgba(10,9,8,0.96)"/>
        </linearGradient>
        <radialGradient id="sunDisc" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(232,184,109,0.5)"/>
          <stop offset="55%" stop-color="rgba(232,184,109,0.22)"/>
          <stop offset="100%" stop-color="rgba(232,184,109,0)"/>
        </radialGradient>
      </defs>

      <!-- 天空：日轮与水墨云（浅色=淡金日轮+墨云；深色=月盘+光云） -->
      <circle class="isle-sun" cx="1245" cy="66" r="74" fill="url(#sunDisc)"/>
      <g class="isle-cloud" opacity="0.9">
        <ellipse cx="330" cy="64" rx="120" ry="17" />
        <ellipse cx="405" cy="50" rx="78" ry="13" />
        <ellipse cx="255" cy="52" rx="60" ry="11" />
      </g>
      <g class="isle-cloud" opacity="0.7">
        <ellipse cx="1150" cy="126" rx="88" ry="13" />
        <ellipse cx="1210" cy="114" rx="55" ry="10" />
      </g>
      <!-- 灯塔 -->
      <circle cx="800" cy="64" r="52" fill="url(#lgGlow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <polygon points="800,66 738,4 862,4" fill="url(#lgBeam)" opacity="0.35">
        <animate attributeName="opacity" values="0.2;0.45;0.2" dur="4.5s" repeatCount="indefinite"/>
      </polygon>
      <rect class="lt" x="791" y="70" width="18" height="34" rx="2" fill="rgba(240,220,190,0.85)"/>
      <rect class="lt" x="794" y="52" width="12" height="20" rx="2" fill="rgba(240,220,190,0.75)"/>
      <rect class="lt" x="791" y="48" width="18" height="7" rx="2" fill="rgba(240,220,190,0.9)"/>
      <circle cx="800" cy="52" r="3.5" fill="#e8b86d">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <!-- 岛屿 -->
      <path class="isle-hill-far" d="M 0,240 L 0,206 C 260,200 480,186 700,168 C 920,150 1240,158 1600,178 L 1600,240 Z"/>
      <path class="isle-hill" d="M 0,240 L 0,196 C 200,188 380,168 560,142 C 700,122 760,108 800,104
               C 850,108 920,124 1060,146 C 1240,170 1420,188 1600,194 L 1600,240 Z"/>
      <!-- 水波光 -->
      <line class="wave" x1="180" y1="212" x2="420" y2="212" stroke-width="1"/>
      <line class="wave" x1="640" y1="222" x2="980" y2="222" stroke-width="1"/>
      <line class="wave" x1="1180" y1="210" x2="1460" y2="210" stroke-width="1"/>
    </svg>
  </div>
</section>

<!-- ══════ 右：登录 / 注册 ══════ -->
<section class="panel panel-right">
  <a class="back rise" href="index.html">← 返回主页</a>
  <div class="card">
    <div class="r-brand rise">
      <img class="r-logo" src="assets/favicon.png" alt="">
      <div>
        <div class="r-title">研屿</div>
        <div class="r-sub">考研舆情分析 · 智能择校</div>
      </div>
    </div>

    <div class="tabs rise">
      <button class="tab active" id="tabLogin" type="button" onclick="switchTab('login')">登 录</button>
      <button class="tab" id="tabReg" type="button" onclick="switchTab('register')">注 册</button>
    </div>

    <div class="err rise" id="errBox"></div>

    <!-- 登录 -->
    <form id="formLogin" onsubmit="return doLogin(event)">
      <div class="form-scroll">
        <div class="field">
          <label>用户名</label>
          <input id="loginUser" autocomplete="username" placeholder="你的用户名" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="密码" required>
        </div>
      </div>
      <button class="submit" type="submit" id="loginBtn">登 录</button>
    </form>

    <!-- 注册 -->
    <form id="formReg" style="display:none" onsubmit="return doRegister(event)">
      <div class="form-scroll">
        <div class="field">
          <label>用户名（3 位以上）</label>
          <input id="regUser" autocomplete="username" placeholder="字母 / 数字 / 中文均可" required minlength="3">
        </div>
        <div class="field">
          <label>昵称（选填，报告中称呼你）</label>
          <input id="regNick" maxlength="32" placeholder="如：林同学">
        </div>
        <div class="field">
          <label>邮箱（选填）</label>
          <input id="regEmail" type="email" autocomplete="email" placeholder="name@example.com">
        </div>
        <div class="field">
          <label>密码（6 位以上）</label>
          <input id="regPass" type="password" autocomplete="new-password" placeholder="设置密码" required minlength="6">
        </div>
        <div class="field">
          <label>确认密码</label>
          <input id="regPass2" type="password" autocomplete="new-password" placeholder="再输一遍" required>
        </div>
      </div>
      <button class="submit" type="submit" id="regBtn">注册并进入</button>
    </form>

    <div class="demo-hint rise">
      演示账户 <a onclick="fillDemo()">一键填入</a>
      <div style="margin-top:10px"><a href="terms.html" target="_blank">用户协议</a> · <a href="privacy.html" target="_blank">隐私政策</a></div>
    </div>
  </div>
</section>

<!-- 维护弹窗 -->
<div class="maint-overlay" id="maintModal" onclick="if(event.target===this)closeMaint()">
  <div class="maint-box">
    <div class="maint-icon">🔧</div>
    <div class="maint-title">系统维护中</div>
    <div class="maint-desc">当前注册通道暂时关闭，请使用演示账户体验。<br>正式开放注册敬请期待。</div>
    <button class="maint-close" onclick="closeMaint()">我知道了</button>
  </div>
</div>

<script src="mock-api.js"></script>
<script>window.GY_PUBLIC_PAGE = true;</script>
<script src="assets/app.js?v=18"></script>
<script>
// 星星（左板块）
(function () {
  const box = document.getElementById('lstars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'l-star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;top:${Math.random() * 62}%;--dur:${3 + Math.random() * 5}s;--delay:${Math.random() * 5}s`;
    box.appendChild(s);
  }
})();

// 板块汇合入场
// 到站汇合动画：正常帧率下双 rAF 后揭幕；帧被节流时（应用内浏览器按需出帧 / 后台标签页）
// rAF 永不触发，且过渡动画会冻结在位移中态——兜底检测到未就位就关过渡硬切到位
const _clearBoot = () => document.body.classList.remove('boot');
requestAnimationFrame(() => requestAnimationFrame(_clearBoot));
setTimeout(() => {
  const panel = document.querySelector('.panel-right');
  if (!panel || !document.body.classList.contains('boot')) return; // 正常路径已就位
  panel.style.transition = 'none';
  _clearBoot();
  void panel.offsetWidth; // 强制样式失效，transform 直接落到最终位
  setTimeout(() => { panel.style.transition = ''; }, 120);
}, 400);

// 目标页校验：只允许站内相对路径，防开放跳转
let NEXT = 'index.html';
try {
  const n = new URLSearchParams(location.search).get('next');
  if (n && /^[a-z0-9_\-./]+(\?[a-z0-9_=&\-]*)?$/i.test(decodeURIComponent(n)) && !n.includes('//')) NEXT = n;
} catch (e) { /* 保持默认 */ }

let leaving = false;
function leaveTo(url) {
  if (leaving) return;
  leaving = true;
  document.body.classList.add('leaving');       // 两板块向两侧分离
  setTimeout(() => location.replace(url), 640); // 动画收尾后跳转
}

const errBox = document.getElementById('errBox');
function showErr(msg) { errBox.textContent = msg; errBox.classList.add('show'); }
function clearErr() { errBox.classList.remove('show'); }

// 已带有效 token → 等汇合动画结束后直接分离进入
(async function tryExisting() {
  const t = localStorage.getItem('gy_token');
  if (!t) return;
  let ok = false;
  try {
    const r = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${t}` } });
    ok = r.ok;
  } catch (e) { /* 后端未启动：留在登录页 */ }
  if (ok) setTimeout(() => leaveTo(NEXT), 950);
})();

function switchTab(which) {
  clearErr();
  if (which === 'register') { showMaint(); return; }
  document.getElementById('tabLogin').classList.toggle('active', which === 'login');
  document.getElementById('tabReg').classList.toggle('active', which === 'register');
  document.getElementById('formLogin').style.display = which === 'login' ? '' : 'none';
  document.getElementById('formReg').style.display = which === 'register' ? '' : 'none';
}

function showMaint() { document.getElementById('maintModal').classList.add('show'); }
function closeMaint() { document.getElementById('maintModal').classList.remove('show'); }

function fillDemo() {
  switchTab('login');
  document.getElementById('loginUser').value = 'demo';
  document.getElementById('loginPass').value = 'demo1234';
  clearErr();
}

async function parseErr(r, fallback) {
  let detail = fallback;
  try {
    const d = await r.json();
    detail = typeof d.detail === 'string' ? d.detail
      : Array.isArray(d.detail) ? d.detail.map(x => x.msg).join('；') : fallback;
  } catch (e) { /* ignore */ }
  return detail;
}

async function doLogin(ev) {
  ev.preventDefault();
  clearErr();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUser').value.trim(),
        password: document.getElementById('loginPass').value,
      }),
    });
    if (!r.ok) { showErr(await parseErr(r, `登录失败（${r.status}）`)); return false; }
    const d = await r.json();
    localStorage.setItem('gy_token', d.access_token);
    leaveTo(NEXT);
  } catch (e) {
    showErr('无法连接服务，请确认后端已启动');
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
  return false;
}

async function doRegister(ev) {
  ev.preventDefault();
  clearErr();
  const pass = document.getElementById('regPass').value;
  if (pass !== document.getElementById('regPass2').value) { showErr('两次输入的密码不一致'); return false; }
  const email = document.getElementById('regEmail').value.trim();
  const body = {
    username: document.getElementById('regUser').value.trim(),
    password: pass,
  };
  if (email) body.email = email;
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = '注册中…';
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) { showErr(await parseErr(r, `注册失败（${r.status}）`)); return false; }
    const d = await r.json();
    localStorage.setItem('gy_token', d.access_token);
    const nick = document.getElementById('regNick').value.trim();
    if (nick) {
      try {
        await fetch('/api/auth/me', {
          method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${d.access_token}` },
          body: JSON.stringify({ nickname: nick }),
        });
      } catch (e) { /* 昵称失败不阻塞进入 */ }
    }
    leaveTo(NEXT);
  } catch (e) {
    showErr('无法连接服务，请确认后端已启动');
  } finally {
    btn.disabled = false; btn.textContent = '注册并进入';
  }
  return false;
}
</script>
</body>
</html>
